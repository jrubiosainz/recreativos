<!doctype html>
<!--
  UN SOLO VIAJE · design contract
  World   Your own two hands, full of shopping bags, on the way up from a double-parked car to your
          door: portal, lobby, lift or stairs, landing. The Canvas2D building is the source of truth
          (rooms, doors, lifts, the stair light, the bags and the fists holding them). The DOM is
          only what the fruit shop prints and weighs: the scale is the menu, its thermal label is
          the HUD, and the plastic bag it all came in carries the result.
  Type    Sofia Sans Extra Condensed 800 for everything printed big; Sofia Sans Condensed 500–700
          (italic 700 for shouts) for the small print; DSEG7 Classic for whatever an LCD shows.
  Colour  tile #7f9160 / grout #5f6e45, bezel #ece6d6 / #c8c0ab, LCD #b7c0a1 with segments
          #1f251d, label #f5f2ea, ink #1c1d1a, brand green #2f6b3f / #3f8a52, pilot #ff8a24,
          orange #e8762a, red #c8372d, sticker yellow #f6e27f.
  Shape   thermal labels with a green band and a real EAN-13 (prefix 2, weight in grams); PLU keys
          with a product on each; checks are printed discs; what-next buttons are paper tags with
          an eyelet; the result is a round rubber seal.
  Motion  the hands carry the motion. The scale settles on the weight; the printer feeds the label
          out; the checks tick one by one and the seal comes down. Reduced motion keeps every
          reading and every mark, and drops the travel.
-->
