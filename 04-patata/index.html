<!doctype html>
<!--
  ¡PATATA! · design contract
  World   The García family photo album, 1996–2001, and the 35 mm compact that fills it. The Canvas2D
          camera is the source of truth (the finder, the family, the LCD, the shutter button, what
          people say); the DOM is only the family's paperwork, lying on the walnut table: the album's
          padded cover, its pages with photo corners and ballpoint captions, the index card clipped
          on before each photo, and the photo shop's «revelado en una hora» envelope.
  Type    Titan One for the logo and anything stuck on (stickers, big numbers); Archivo, variable
          width, for everything printed (labels, buttons, the shop's envelope); Kalam for anything
          written by hand (captions, notes, people talking); Permanent Marker for the red marker.
  Colour  oxblood leatherette #6d1f2a / #4a121a, gold foil #e2b857, album page #f4ecd9, kraft
          #c9a878, photo paper #fbfaf6, sticker mustard #e8b62c, ballpoint blue #28408f, marker red
          #e0262e, date-stamp orange #ff8a1f, ink #2a1a14, camera graphite #2b2d31, silver #c9ccd1.
  Shape   the cover is stitched and padded; prints sit a little askew under black photo corners;
          the brief is a ruled index card under a clip; primary buttons are sticker-bright, round
          ones are the camera's own buttons; messages come on label-maker tape.
  Motion  one material per surface: the card slides in under its clip, prints slide out of the
          envelope still developing, the marker circles whoever blinked, the sticker slaps on.
          Reduced motion keeps the information and removes the movement.
-->
