<!doctype html>
<!--
  PERDÓN, PERDÓN · design contract
  World   One morning at Plaza del Reloj, a made-up interchange of the METROPOLITANO, and the card
          ticket in your pocket. The Canvas2D station is the source of truth: tiled corridors, the
          crowd and where every face is looking, the train. The DOM is only the ticket, stamped by
          the validator after each trip.
  Type    Anybody, variable width, for everything printed or signposted; Doto for whatever a
          validator or a departures board prints (times, counts, stamps).
  Colour  tile #f3f2ec, network blue #2350a8 / #1e3f95, ink #1d2233, ticket pink #efb4c4,
          validator violet #643991, raincoat yellow #f2c21a, go #267e46, stop #d5342c.
  Shape   the ticket is a 66×30 card with a black magnetic stripe; trips are dot-matrix stamp
          rows; stars are punched holes; buttons are rubber-stamp outlines.
  Motion  people carry the motion. The ticket slides into the validator and comes back stamped.
          Reduced motion keeps every stamp and drops the slide.
-->
