  FIESTAS DE LOS JUEGOS VIRALES · direction contract
  THESIS  A village fiesta programme, «del 1 al 11»: each game is one day's act with hour, place and photo;
          a biro marks the ones you have been to. Refuses the portal grid of equal tiles.
  OWN-WORLD  Four-ink offset print: red cover, fat-slab Ultra in yellow over an ink shadow, paper bunting,
          day ribbons in red, blue, green, yellow; white inner pages in Archivo; ballpoint-blue handwriting;
          stamp red; joke adverts each in its shop's type.
  STORY   Visitors read a programme, learn in one line these are eleven free browser games, tap «¡Allá voy!»;
          back, the pen has marked it.
  FIRST VIEWPORT  Bunting, FIESTAS huge on the red cover, the blurb; then Lunes 1, BOSTEZO's photo and
          pennant. Desktop: sticky cover page with the contents on the left.
  FORM    Programa de fiestas, 4th of 7, seed 0e190a29; staging: interstitial labels (day ribbons, adverts,
          the mayor's letter).
-->
