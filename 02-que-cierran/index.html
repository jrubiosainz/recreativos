<!doctype html>
<!--
  ¡QUE CIERRAN! · design contract
  World   The Canvas2D platform is the source of truth; the DOM extends it as railway hardware and paperwork.
  Type    Fredoka for everything that belongs to the game; Zen Maru Gothic for Japanese signage, always
          paired with its translation (Japanese first, like the real signs), never alone as the only label.
  Colour  ink #1b1d26, paper #fbfaf6, stamp-book paper #f3eee2, the Gyūgyū Line green #16b89c / #0f8a74,
          departure-board glass #121317 with LED amber #ffb23e, signal red #e8412f, stamp red #d23a2c,
          gold #ffd35a. Each station also owns one stamp ink (see src/stamp.js).
  Shape   controls are chunky ink-outlined pills with a solid drop (the HUD plates' grammar); the level
          select is a black-glass departure board; briefings, results and certificates are paper.
  Motion  one material per surface: the board clacks in and flips JP/translation like split-flap;
          paper lands with an expo ease-out; rubber stamps slam once and print in multiply; the logo
          closes like train doors. Reduced motion removes all of it.
-->
