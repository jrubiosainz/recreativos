<!doctype html>
<!--
  LA GOTA · design contract
  World   A rainy weekday on the city bus, the back seat by the window. The Canvas2D window is the source
          of truth: the street going by behind steamed-up glass, the fog your finger wipes, the drops and
          the kids' shouts, the aluminium frame and the black rubber seal with META written on it in
          marker. The DOM is the bus's own fittings: the title is the bonobús (one row per trip, stars
          are the holes the validator punches), the HUD is the LED sign over the aisle and the red STOP
          button, the result is the back of the ticket, stamped by the validator in violet ink.
  Type    Darumadrop One (letters written with a fingertip on fog) for the logo, the shouts and every
          headline; Shantell Sans 500–800 (a kid's handwriting grown up) for everything that talks;
          Doto 800–900 (dot matrix) for the machines: the LED sign and the validator's stamp.
  Colour  bus wall #23262F / #3A3E4B, fog #E9EEF3, ticket #F3EAD3 with its brown magnetic stripe #3B2A20,
          municipal ink #1D4E9E, validator violet #5B3FA8, LED amber #FF9E1B, STOP red #E3262B; the kids:
          you #FFC23D (the yellow raincoat), Dani #FF5A4E, Lucía #7CE0B8, Iker #6FB7FF, Vega #D08CFF.
  Shape   a paper ticket with rounded corners and its brown magnetic stripe; punched holes; the LED sign in its black
          housing; a round red STOP button; speech bubbles like the ones the kids shout on the glass.
  Motion  the glass carries the motion (rain, fog coming back, drops racing, the bus rattling it).
          The DOM moves like paper and machines: tickets slide out of the rack, holes punch in one by
          one, the LED blinks at 2 Hz. Reduced motion keeps every reading and drops shake and confetti.
-->
