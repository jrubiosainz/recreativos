<!doctype html>
<!--
  BOSTEZO · design contract
  World   The Canvas2D office cartoon is the source of truth; the DOM only extends it.
  Type    Fredoka for everything that belongs to the game; system-ui for the office paperwork
          (invite, minutes, HR letter, auto-reply) so corporate documents look corporate.
  Colour  ink #1d1733, cream #fff8ec, lavender #b9acdf, plus the game's own accents: yawn lilac
          #c3b3ff / #9d7bff / #6b4fd8, you-yellow #ffd166, HR red #ff5a4f.
  Shape   chunky ink-outlined pills with a solid drop (the yawn button's grammar) for controls;
          paper sheets with a soft offset shadow, slightly tilted, for documents.
  Motion  one material: paper. Sheets land with an expo ease-out, the HR stamp slams once, the
          logo yawns letter by letter like the contagion. Reduced motion removes all of it.
-->

<title>BOSTEZO · Haz bostezar a tu jefe</title>
