<!doctype html>
<!--
  A LA FRANCESA · design contract
  World   An office building at six in the evening, floor by floor, top to bottom: a miniature diorama seen from
          above, low-poly and toon-lit (three.js), with the people's sightlines painted on the carpet as light.
          The 3D floor is the source of truth: the desks, the glass fishbowls, the birthday in the kitchen, Don
          Ramón's rounds, the ping-pong table, the lobby. The DOM is the building's own hardware: the title is
          the lift lobby's pillar (a felt letter board with the directory in white plastic letters, and the
          brushed-steel call panel under it whose floor buttons are the level select), the HUD is the lift's
          amber dot-matrix floor indicator, a wall-clock pill and a steel phone button, the tutorial is laminated
          AVISO notices taped up, the pause is the «VUELVO EN 5 MINUTOS» sheet, getting out is the lift panel
          rolling down a floor, getting caught is a meeting invite from whoever caught you.
  Type    Rubik 400–800 everywhere (the round-shouldered plastic letters of the felt board, the numbers engraved
          on the lift buttons); the invite deliberately parodies the operating system's own calendar face.
  Colour  felt #1B1A1C, letters #F2EFE6; steel #C9CCD1 → #8D9199, steel ink #2C2F35; LED amber #FFB02E, unlit
          #5A3A0C on #140D08; SALIDA green #1FA45A glowing #5DFF9B; AVISO paper #FBFAF5; invite blue #2F7DE1 on
          #F7F8FA, ink #1F2330, grey #5D6472; each floor adds its own accent from the carpet.
  Shape   screws in the corners of steel; tape on paper; round lift buttons with a lit ring; LEDs in threes;
          the comic bubble with a tail on the speaker's head.
  Motion  the floor carries the motion (it assembles, people drop in, you tiptoe out). The DOM moves like the
          hardware: buttons press in, the display rolls, notices are taped up and taken down. Reduced motion
          keeps every reading and freezes the lobby's demo.
-->
