<!doctype html>
<!--
  LA OLA · design contract
  World   A football stadium at minute 80, 0–0, seen from the blimp: the whole bowl in a 3/4 oval,
          thousands of fans in their seats, the LED boards round the pitch and the videomarcador
          hanging over the centre circle. The Canvas2D stadium is the source of truth (stands, people,
          the LED ribbon that draws each wave's lap, the players, the big screen and its close-up
          feed). The DOM is the stadium's own electronics: the title is the scoreboard's fixture list,
          the HUD is the director's control desk (tally, ON AIR button), the result is the full-time
          board.
  Type    Doto 800–900 (LED dot matrix) for every number and every shout on a screen; Big Shoulders
          Display 800–900 for stadium signage (level names, buttons); Barlow Semi Condensed 500/700
          for the small print.
  Colour  panel #07080B, housing #1B1D23 / #2A2D36, LED amber #FFB31A, LED green #39FF7A, tally red
          #FF3B30, lap cyan #3FD8FF, lap magenta #FF5FD2, paper #F4F1EA; home red #D6283E, away blue.
  Shape   LED panels behind a pixel grid, housings with rounded corners and bolt heads; the stars are
          floodlight lamps that switch on; the ON AIR button is a tally light.
  Motion  the wave carries the motion: the title's attract loop runs a real wave behind the board,
          LED lines blink at 2–3 Hz, shouts pop with overshoot, the result's lamps switch on one by
          one. Reduced motion keeps every reading and drops shake, flashing and the attract loop.
-->
