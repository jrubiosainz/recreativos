<!doctype html>
<!--
  HIPO · design contract
  World   A municipal pool in high summer, seen as a sun-faded poster from the 80s: painted tiles,
          parasols, deck chairs, a lifeguard on his stool and grannies in folding chairs. The Canvas2D
          pool is the source of truth (tiles, water, props, people, the hippo and his hiccups). The DOM
          is only what the poster prints: the title is the poster itself, taped to the tile wall; the
          HUD is its red roundels and PREMIO sticks; the result is the poster's yellow bottom band.
  Type    Gluten 850 for every letter that shouts (HIPO, level names, ¡BOMBA!); Kanit 600/700 for
          the small print, Kanit 800 italic for what the lifeguard yells.
  Colour  navy #1D2F6F, blue #2B4FA3, sky #9FD3E8, pool #3BB7D8, yellow #F6D34A, pink #F06A8E,
          red #D8322A, paper #F3E6C4, tile #A9C6DA, key line #2A2150, wood #D9B274 / #8A5A2B.
  Shape   bubble letters with a blue extrusion; red roundels with a white inner ring; ice-lolly
          PREMIO sticks as stars; masking tape on the corners; «AGOTADO» tape across locked levels.
  Motion  the hiccup carries the motion: the mascot jolts on the title, the HUD roundel pops, the
          band's waltz lands its downbeat on each «¡HIP!». Reduced motion keeps every reading and
          drops the travel (no hit-stop slow motion, no jolts).
-->
