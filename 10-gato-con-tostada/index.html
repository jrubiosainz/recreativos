<!--
  GATO CON TOSTADA · design contract
  World   A Spanish flat from the seventies cut open like a doll's house, the neighbours' flats glowing above
          and below: breakfast, noon, dusk, evening, bathtime, a windy night on the terrace. The Canvas2D stage
          is the source of truth: the rooms, the ginger cat with a slice of toast and strawberry jam taped to
          its back, the golden cushion of paradox it hovers on, the squeezy jam bottles, the things it knocks
          off, the shouts in magnet letters; each room opens on the cat's leap from somewhere high, taping the
          toast on as it falls. The DOM is the kitchen's own fridge door: the title is the door (the logo in
          magnet letters, one biro note per room held up by a magnet), the HUD is a jar of jam on its side and
          a red magnet that pauses, the pause is the shopping list, the result is a Polaroid of the landing.
  Type    Fredoka 600–700 (the rounded plastic of magnet letters) for the logo, the shouts, buttons, numbers;
          Patrick Hand (a note in biro) for the notes, captions and asides; Nunito 600–900 for what must read.
  Colour  ink #2A1C14, fridge enamel #F6F2E9 / #E4DCCB, chrome #C9CDD2, gold #FFD84A / #F7C832 (the cushion,
          the buttons), jam #D2283C / #8E1426, crust #B86A2C, ginger #F08A3C; magnets red #E0463B, blue #3B7BE0, yellow #F2C230, green #43B67A; notes
          yellow #FFF3A6, pink #FFD9E0, blue #D6ECFF, green #E2F5CC, lined white #FFFDF6.
  Shape   paper notes a little askew under a round plastic magnet; magnet letters; the jam jar with its
          gingham lid; a Polaroid with its thick bottom margin; nothing is a plain rectangle card.
  Motion  the stage carries the motion. The DOM moves like things on a fridge: notes swing in on their magnet,
          magnets clack into place, the Polaroid develops out of grey. Reduced motion keeps every reading.
-->
