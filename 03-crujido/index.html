<!doctype html>
<!--
  CRUJIDO · design contract
  World   A 1950s Gran Vía picture palace, painted like its billboards. The Canvas2D cinema is the
          source of truth (street, facade, hall, film, people, your hands); the DOM only adds the
          cinema's own paperwork and fittings: the letter board of today's sessions, the booth's
          ticket, the intermission slide, the film-strip result.
  Type    Limelight for the marquee and the logo; Shrikhand for poster titles and rubber stamps;
          Oswald for everything printed or slotted (letter board, ticket, labels, numbers);
          Caveat Brush for people talking in the room; Atkinson Hyperlegible for captions and body.
  Colour  night navy #0b1020, velvet #8e1520 / #5a0a12, bulb amber #ffb347, gold #ffd98a,
          cream card #fbf3df, heard red #e8252f, strike red #ff3b30, caption yellow #ffd35e.
  Shape   the letter board is cream rails with black slotted letters; the ticket is printed paper
          with a perforated stub; round buttons are brass bezels; results are a strip of film.
  Motion  one material per surface: posters flip like louvres, the stub tears along its
          perforation, the house lights go down, stars light like bulbs. Reduced motion keeps
          the information and removes the movement.
-->
